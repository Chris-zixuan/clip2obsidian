# clip2obsidian 配置模板
# 复制为 config.toml 后按本机情况修改。config.toml 已在 .gitignore 中，不会入库。

[vault]
# Obsidian 知识库根目录
path = "/Users/<you>/Documents/Obsidian/我的知识库"
# 剪藏落点（相对 vault 根）
inbox_subdir = "0_Inbox/Clippings"
# 附件目录（相对 vault 根）
attachment_subdir = "8_附件"

[ingest]
# 收件目录：无参数运行 `clip.py` / `clip.py scan` 时扫描这里。支持 ~ 与环境变量
inbox_dir = "~/Downloads/clip2obsidian"
# `--url` 元信息增强（yt-dlp --skip-download）的网络超时（秒）。失败只记 warning
timeout_sec = 60

[asr]
# 转写引擎（引擎注册表见 asr/base.py::_ENGINE_MODULES）
backend = "faster"
# 模型规格：medium / small / tiny
model = "medium"
language = "zh"
# 强制离线，只用已缓存的模型。换新模型时须临时设为 false 让它先下载
offline = true
# initial_prompt = "以下是普通话内容，请使用简体中文转写。"

[tools]
# ffmpeg 可执行文件路径。留空则从 PATH 查找
ffmpeg = ""
# 运行子步骤（转写 / yt-dlp 元信息增强）的 Python 解释器。
# 留空则用当前解释器；依赖装在独立 venv 里时必须显式指向它
python = ""

[publish]
# 文件名长度上限（字符）
filename_max_len = 60
# 落库后是否自动跑断链校验（需 obsidian CLI）
verify_after_publish = true
# frontmatter `description` 取值口径
#   auto       平台文案够长就用它，否则退回转写（默认）
#   platform   只用平台自带文案
#   transcript 只用转写文本（含 ASR 同音字错误）
description_source = "auto"
