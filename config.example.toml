# clip2obsidian 配置模板
# 复制为 config.toml 后按本机情况修改。config.toml 已在 .gitignore 中，不会入库。

[ingest]
# 无参数运行时的收件目录（支持 ~ 与环境变量）
inbox_dir = "~/Downloads/clip2obsidian"
# `--url` 元信息增强（yt-dlp 只取 JSON、绝不下载）的网络超时（秒）
timeout_sec = 60
# zip 解压后的内容总量上限（MB），防解压炸弹
max_unzip_mb = 4096

[transcribe]
# auto：本地可用就用本地，否则云端；local / cloud 强制指定
provider = "auto"
# auto：依次探测 mlx-whisper（Apple Silicon 快）与 faster-whisper（CPU 可跑）
engine = "auto"
# 模型短名。带 "/" 视为完整仓库名直接透传；
# 否则按引擎映射：mlx → mlx-community/whisper-<model>-mlx，faster → <model>
model = "large-v3"
language = "zh"
# 强制离线，只用已缓存的模型；换新模型时临时设为 false 先下载
offline = true
# 分片时长（秒）。分片是为了拿到确定进度、限制内存、单片可重试
chunk_sec = 600
# 领域提示词：纠正模型对专有名词的系统性误识（强烈建议填）
# initial_prompt = "以下是关于……的技术分享，普通话口播。请使用简体中文输出并添加标点。英文技术名词保持原文写法。"

[transcribe.cloud]
# OpenAI 兼容端点，可接 OpenAI / 硅基流动 / 小米 MiMo 等。
# base_url 与 api_key 都填了才视为可用；provider = "auto" 时本地优先
base_url = ""
api_key = ""
model = "whisper-1"
timeout_sec = 300

[tools]
# 留空则从 PATH 与常见落点自动探测
ffmpeg = ""
ffprobe = ""

[progress]
# inline：终端就地刷新进度条（默认，非终端环境自动降级为分段日志）
# window：另开一个终端窗口显示进度条（仅 macOS）
# off：   不打进度
mode = "inline"
